services:
  postgres:
    image: postgres:17-alpine
    container_name: uway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: uway
      POSTGRES_USER: uway_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - uway-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uway_app -d uway"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  uway-postgres-data:
